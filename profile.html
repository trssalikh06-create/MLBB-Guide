<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Профиль — MLBB Guide</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header class="header">

    <div class="nav">

        <a
            href="index.html"
            class="logo"
        >
            MLBB Guide
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Герои
            </a>

            <a href="items.html">
                Предметы
            </a>

            <a
                href="auth.html"
                id="authLink"
            >
                Войти
            </a>

            <a
                href="profile.html"
                id="profileLink"
                class="hidden"
            >
                Профиль
            </a>

            <a
                href="admin.html"
                id="adminLink"
                class="hidden"
            >
                Админка
            </a>

        </nav>

    </div>

</header>


<main class="container">


    <div class="profile-page">

        <div class="profile-header">

            <div
                class="profile-avatar"
                id="profileAvatar"
            >
                ML
            </div>

            <div>

                <h1 id="profileName">
                    Профиль
                </h1>

                <p id="profileEmail">
                    Загрузка...
                </p>

            </div>

        </div>


        <section class="profile-box">

            <h2>
                Мой профиль
            </h2>


            <form id="profileForm">


                <div class="form-group">

                    <label for="profileNameInput">
                        Имя
                    </label>

                    <input
                        type="text"
                        id="profileNameInput"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="nickname">
                        Игровой ник
                    </label>

                    <input
                        type="text"
                        id="nickname"
                        placeholder="Например: SalihML"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        disabled
                    >

                </div>


                <div class="form-group">

                    <label for="avatar">
                        URL аватара
                    </label>

                    <input
                        type="url"
                        id="avatar"
                        placeholder="https://..."
                    >

                </div>


                <div class="form-group">

                    <label for="favoriteRole">
                        Любимая роль
                    </label>

                    <select id="favoriteRole">

                        <option value="">
                            Не выбрано
                        </option>

                        <option value="Tank">
                            Tank
                        </option>

                        <option value="Fighter">
                            Fighter
                        </option>

                        <option value="Assassin">
                            Assassin
                        </option>

                        <option value="Mage">
                            Mage
                        </option>

                        <option value="Marksman">
                            Marksman
                        </option>

                        <option value="Support">
                            Support
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="favoriteHero">
                        Любимый герой
                    </label>

                    <input
                        type="text"
                        id="favoriteHero"
                        placeholder="Например: Gusion"
                    >

                </div>


                <div class="form-group">

                    <label for="bio">
                        О себе
                    </label>

                    <textarea
                        id="bio"
                        placeholder="Расскажите немного о себе..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Сохранить профиль
                </button>


                <p
                    id="profileMessage"
                    class="auth-message"
                ></p>

            </form>

        </section>


        <section class="profile-box">

            <h2>
                Избранные герои
            </h2>

            <div
                id="favoritesContainer"
                class="cards"
            ></div>

        </section>


        <section class="profile-box">

            <h2>
                История
            </h2>

            <div id="historyContainer"></div>

        </section>


        <button
            id="logoutBtn"
            class="btn btn-danger"
        >
            Выйти из аккаунта
        </button>


    </div>

</main>


<script
    type="module"
    src="js/common.js"
></script>

<script
    type="module"
    src="js/profile.js"
></script>


</body>

</html>
